<div class="card">
  <h3>
    <a [routerLink]="['/courses', course().id]">
      {{ course().title }}
    </a>
    <span class="code">({{ course().code }})</span>
  </h3>

  <p>Enrolled {{ course().enrollmentCount }} of {{ course().maxCapacity }} seats</p>

  <span class="badge" 
        [class.badge-open]="course().enrollmentCount < course().maxCapacity"
        [class.badge-closed]="course().enrollmentCount >= course().maxCapacity">
    {{ course().enrollmentCount >= course().maxCapacity ? 'Full' : 'Accepting enrollments' }}
  </span>

  <button class="btn-enroll"
          [class.btn-enroll-active]="course().enrollmentCount < course().maxCapacity"
          [class.btn-enroll-disabled]="course().enrollmentCount >= course().maxCapacity"
          (click)="enrollClicked.emit(course())"
          [disabled]="course().enrollmentCount >= course().maxCapacity">
    Enroll
  </button>
</div>
