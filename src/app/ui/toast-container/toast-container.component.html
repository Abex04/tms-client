<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="rounded-lg shadow-lg border px-4 py-3 text-sm flex items-start gap-3"
      [class.bg-green-50]="toast.type === 'success'"
      [class.border-green-200]="toast.type === 'success'"
      [class.text-green-800]="toast.type === 'success'"
      [class.bg-red-50]="toast.type === 'error'"
      [class.border-red-200]="toast.type === 'error'"
      [class.text-red-800]="toast.type === 'error'"
      [class.bg-slate-50]="toast.type === 'info'"
      [class.border-slate-200]="toast.type === 'info'"
      [class.text-slate-800]="toast.type === 'info'"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button (click)="toastService.dismiss(toast.id)" class="text-xs opacity-60 hover:opacity-100">✕</button>
    </div>
  }
</div>
