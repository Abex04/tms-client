<div class="max-w-3xl mx-auto p-6 bg-slate-50 min-h-screen">
  <div class="flex items-center gap-3 mb-6">
    <a routerLink="/dashboard" class="text-slate-400 hover:text-slate-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
    </a>
    <h1 class="text-2xl font-bold text-slate-800">My Profile</h1>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="bg-gradient-to-br from-blue-700 via-indigo-700 to-indigo-900 px-6 py-10 flex flex-col items-center">
      <div class="w-20 h-20 rounded-full bg-white text-indigo-700 flex items-center justify-center text-2xl font-bold shadow-lg mb-3">
        {{ auth.currentUser()?.displayName?.charAt(0) ?? 'U' }}
      </div>
      <h2 class="text-xl font-semibold text-white">{{ auth.currentUser()?.displayName }}</h2>
      <span class="mt-1 text-xs font-medium bg-white/20 text-white px-3 py-1 rounded-full">
        {{ auth.currentUser()?.role }}
      </span>
    </div>

    <div class="p-6 space-y-5">
      <div>
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1">Full name</label>
        <p class="text-sm text-slate-800">{{ auth.currentUser()?.displayName }}</p>
      </div>

      <div class="border-t border-slate-100"></div>

      <div>
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1">Email</label>
        <p class="text-sm text-slate-800">{{ auth.currentUser()?.email }}</p>
      </div>

      <div class="border-t border-slate-100"></div>

      <div>
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1">Role</label>
        <p class="text-sm text-slate-800">{{ auth.currentUser()?.role }}</p>
      </div>
    </div>

    <div class="px-6 pb-6 flex gap-3">
      <a routerLink="/forgot-password"
        class="flex-1 text-center text-sm font-medium text-blue-600 hover:text-blue-700 border border-blue-200 hover:bg-blue-50 rounded-lg px-4 py-2 transition-colors">
        Change Password
      </a>
      <button (click)="logout()"
        class="flex-1 text-sm font-medium text-red-600 hover:text-red-700 border border-red-200 hover:bg-red-50 rounded-lg px-4 py-2 transition-colors">
        Logout
      </button>
    </div>
  </div>
</div>
