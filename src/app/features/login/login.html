<div class="max-w-sm mx-auto p-6 bg-white rounded-xl shadow-sm border border-slate-200 mt-16">
  <h2 class="text-lg font-semibold text-slate-700 mb-4">Login</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
      <input type="email" formControlName="email"
        class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
      <input type="password" formControlName="password"
        class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
    </div>

    @if (errorMessage()) {
      <p class="text-red-500 text-sm">{{ errorMessage() }}</p>
    }

    <button type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition-colors">
      Login
    </button>
  </form>
</div>
