<table mat-table [dataSource]="dataSource" matSort class="custom-table">

  <ng-container matColumnDef="studentName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Student</th>
    <td mat-cell *matCellDef="let row">{{ row.studentName }}</td>
  </ng-container>

  <ng-container matColumnDef="courseName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Course</th>
    <td mat-cell *matCellDef="let row">{{ row.courseName }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
    <td mat-cell *matCellDef="let row">
      <span class="status-badge"
        [class.approved]="row.status === 'Approved'"
        [class.rejected]="row.status === 'Rejected'"
        [class.pending]="row.status === 'Pending'">
        {{ row.status }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      @if (row.status === 'Pending') {
        <button class="approve-btn" (click)="onApprove(row)">Approve</button>
        <button class="reject-btn" (click)="onReject(row)">Reject</button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 25, 50]" showFirstLastButtons></mat-paginator>
